name: CI

on:
  pull_request:
  push:
    branches: [ "main", "develop", "sit", "uat" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & test
        run: mvn -B clean test

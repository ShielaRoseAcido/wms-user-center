spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wms}

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
server.port=${SERVER_PORT:8080}

APP_BASIC_USER=testuser
APP_BASIC_PASS=testpass
# DB (local defaults, but Jenkins can override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/libraryDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Actuator (keep simple/safe)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Tomcat access log
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b

# Optional (only if you really use devtools locally; safe to keep)
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

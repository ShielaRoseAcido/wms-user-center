<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>Add/Edit WMS User</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css" />
</head>

<body>
<div class="container my-5">
  <h3>Add WMS User</h3>
  <div class="card">
    <div class="card-body">
      <div class="col-md-10">
        <form action="#" th:action="@{/addWMSUser}" th:object="${wmsUser}" method="post">
          <div class="row">
            <div class="form-group col-md-8">
              <label for="employeeName" class="col-form-label">Employee Name</label>
              <input type="text" th:field="*{employeeName}" class="form-control"
                     id="employeeName" placeholder="WMS User Name" />
              <div class="text-danger" th:if="${#fields.hasErrors('employeeName')}" th:errors="*{employeeName}"></div>
            </div>

                <div class="form-group col-md-8">
                    <label for="employmentType">Employment Type</label>
                    <select id="employmentType" name="employmentType" class="form-control">
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('employmentType')}" th:errors="*{employmentType}"></div>
                </div>



            </div>
            <div class="form-group col-md-8">
              <label for="role" class="col-form-label">Role</label>
              <div id="roleDropdownContainer">
                <!-- Dropdown will be inserted here by JS -->
              </div>
              <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
            </div>

            <div class="col-md-6">
              <input type="submit" class="btn btn-primary" value="Submit" />
            </div>

            <input type="hidden" id="id" th:field="*{id}" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Include XSLT and XML as external or embedded resources -->
<script>
  // Function to load XML and XSLT, transform, and inject dropdown
  function loadRolesDropdown() {
  const xmlPath = '/wmsRoles.xml';
  const xslPath = '/wmsRoles.xsl';
    Promise.all([
      fetch(xmlPath).then(res => res.text()),
      fetch(xslPath).then(res => res.text())
    ]).then(([xmlText, xslText]) => {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'application/xml');
      const xsl = parser.parseFromString(xslText, 'application/xml');

      const xsltProcessor = new XSLTProcessor();
      xsltProcessor.importStylesheet(xsl);

      const resultDocument = xsltProcessor.transformToFragment(xml, document);
      document.getElementById("roleDropdownContainer").appendChild(resultDocument);
    }).catch(err => {
      console.error('Failed to load or transform XML/XSL:', err);
    });
  }

  // Trigger on page load
  //window.onload = loadRolesDropdown;
</script>
<script>
  document.querySelector("form").addEventListener("submit", function (e) {
    const name = document.getElementById("employeeName").value;
    if (!name || name.includes(" ") || !name.includes(".")) {
      alert("Employee name is required, must not contain spaces, and must include at least one period (e.g. john.doe)");
      e.preventDefault();
    }
  });
</script>

<script>
    function loadEmploymentTypesDropdown() {
      fetch('/employmentTypes.json')
        .then(response => {
          if (!response.ok) {
            throw new Error("Failed to load employment types.");
          }
          return response.json();
        })
        .then(data => {
          const select = document.getElementById("employmentType");
          data.forEach(type => {
            const option = document.createElement("option");
            option.value = type.code;
            option.textContent = type.label;
            select.appendChild(option);
          });
        })
        .catch(error => {
          console.error("Error loading employment types:", error);
        });
    }

    window.onload = function () {
      loadRolesDropdown();           // your existing function for roles
      loadEmploymentTypesDropdown(); // new function for employment type
    };
</script>

</body>
</html>

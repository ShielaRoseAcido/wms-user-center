<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>WMS User</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://www.sunlife.com.ph/content/dam/sunlife/regional/philippines/images/hero-banner/hero-banner-client-center.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      color: #212529;
    }
    .backdrop {
      background: rgba(255, 255, 255, 0.95);
      min-height: 100vh;
    }
    .navbar {
      background-color: #003057 !important;
    }
    .navbar a, .navbar .navbar-text {
      color: #fff !important;
    }
    .hero {
      padding: 6rem 2rem;
      color: white;
      background: linear-gradient(to right, #ffcb05, #003057);
      text-align: center;
    }
    .hero h1 {
      font-weight: 700;
      font-size: 3rem;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 1rem 2rem rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.01);
    }
    .table thead {
      background-color: #003057;
      color: white;
    }
    .btn i {
      margin-right: 5px;
    }
    footer {
      background-color: #f1f1f1;
      padding: 1rem;
    }
  </style>
</head>

<body>
<div class="backdrop">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🧩 GlobalTech Solution Services</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Home</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('Admin')">
            <a class="nav-link" href="/actuator">Actuator</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item me-2">
            <span class="navbar-text">Welcome, <b sec:authentication="principal.username"></b></span>
          </li>
          <li class="nav-item">
            <a class="btn btn-warning text-dark" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Workflow Management User Center</h1>
    </div>
  </section>

  <!-- Main Section -->
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-semibold">📘 WMS User Listings</h2>
      <a href="/edit" class="btn btn-primary" sec:authorize="hasAnyRole('Admin','Publisher')">
        <i class="fas fa-plus-circle"></i> Add User
      </a>
    </div>

    <div class="card p-4">
      <div th:switch="${wmsUsers}">
        <div th:case="null">
          <h4 class="text-muted text-center my-5">No records found.</h4>
        </div>
        <div th:case="*">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
              <tr>
                <th><i class="fas fa-book"></i> Employee Name</th>
                <th><i class="fas fa-align-left"></i> Employment Type</th>
                <th><i class="fas fa-edit"></i> Edit</th>
                <th><i class="fas fa-trash"></i> Delete</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="wmsUser : ${wmsUsers}">
                <td th:text="${wmsUser.employeeName}"></td>
                <td th:text="${wmsUser.employmentType}"></td>
                <td>
                  <a th:href="@{/edit/{id}(id=${wmsUser.id})}" class="btn btn-warning btn-sm" sec:authorize="hasAnyRole('Admin','Publisher')">
                    <i class="fas fa-edit"></i> Edit
                  </a>
                </td>
                <td>
                  <a th:href="@{/delete/{id}(id=${wmsUser.id})}" class="btn btn-danger btn-sm" sec:authorize="hasRole('Admin')">
                    <i class="fas fa-trash"></i> Delete
                  </a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination Controls -->
          <nav th:if="${totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
              <!-- Previous -->
              <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage - 1})}">Previous</a>
              </li>

              <!-- Page Numbers -->
              <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                  th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}"></a>
              </li>

              <!-- Next -->
              <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage + 1})}">Next</a>
              </li>
            </ul>
          </nav>

        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center">
    <small class="text-muted">&copy; 2025 Sun Life Philippines. All rights reserved.</small>
  </footer>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
